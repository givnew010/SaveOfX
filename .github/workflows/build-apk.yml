
name: Build SaveOfX Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # 1. Checkout project
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Java
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # 4. Install Android SDK
      - name: Install Android SDK 36.1
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platforms;android-36.1" \
            "build-tools;36.0.0" \
            "platform-tools"

      # 5. Generate Debug Keystore
      - name: Generate Debug Keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair \
              -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      # 6. Install Gradle 9.3.1
      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      # 7. Verify project files
      - name: Verify Android Project
        run: |
          ls -la
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          gradle --version

      # 8. Build APK
      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace
      
      - name: Diagnose APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          echo "===== APK SIGNATURE ====="
          $ANDROID_HOME/build-tools/36.0.0/apksigner \
            verify --verbose --print-certs "$APK"

          echo "===== APK PACKAGE INFO ====="
          $ANDROID_HOME/build-tools/36.0.0/aapt \
            dump badging "$APK"

          echo "===== APK FILE INFO ====="
          ls -lh "$APK"
          
      # 9. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SaveOfX-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
          
